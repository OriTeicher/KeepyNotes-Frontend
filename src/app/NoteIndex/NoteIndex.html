<add-note (addNote)="onNoteAction($event)"></add-note>
@if (!isLoadingNotes) {
<section class="notes-layout">
  @for (note of notes; track note) {
  <div class="note-preview" [ngStyle]="{'background': note.color}" style="position: relative;" noteHover
    (click)="displayNoteEditor(note._id)" [class.fly-animation]="selectedNote?._id === note._id">
    <dynamic-note [note]="note"> </dynamic-note>
    <note-bottom-actions class="icons-container" [noteId]="note._id" (noteAction)="onNoteAction($event)" />
    <color-picker [noteId]="note._id" [noteColor]="note.color" [selectedNote]="selectedNote!"
      [isColorPickerOpen]="isColorPickerOpen" (selectedColor)="onNoteAction($event)"> </color-picker>
    <labels-editor *ngIf="isLabelsEditorOpen" [noteId]="note._id" [isLabelsEditorOpen]="isLabelsEditorOpen"
      [selectedNote]="selectedNote!">
    </labels-editor>
    @for (label of note.labels; track label) {
    <div class="note-label" [ngStyle]="{'background': label.color}">
      <p>{{label.title}}</p>
    </div>
    }
  </div>
  }
</section>
<router-outlet></router-outlet>
}@if(!notes.length){
<loader></loader>
}
